[project]
name = "fastlogin"
version = "0.1.0"
description = "A small utility for fast authentication workflows"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
    { name = "Uddith Machiraju" }
]

dependencies = [
    "pymongo>=4.0",
]

[project.urls]
Homepage = "https://github.com/uddithmachiraju/fastlogin"

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q --cov=fastlogin --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["fastlogin"]